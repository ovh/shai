name: Unstable Build

on:
  push:
    branches: [main]

permissions: {}

# One publish at a time: a newer push waits instead of racing on the
# delete/create below (and is never cancelled mid-publish).
concurrency:
  group: unstable-release
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      asset-prefix: shai-unstable
      retention-days: 30

  create-unstable-release:
    name: Publish unstable release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # create the release and its tag
      id-token: write     # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shai-unstable-*
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: sha256sum shai-unstable-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/shai-unstable-*

      - name: Publish unstable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Remove the release AND its tag, or the new release reuses the old
          # tag and keeps pointing at the first commit ever published.
          gh release delete unstable --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/unstable" || true
          gh release create unstable dist/* \
            --target "$SHA" \
            --prerelease \
            --title "Unstable Build ($(date -u +%Y-%m-%d))" \
            --notes "Automated unstable build from commit $SHA"
