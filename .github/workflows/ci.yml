name: CI Build

on:
  push:
    branches: [dev/*, feature/*, fix/*]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      asset-prefix: shai
      use-cache: true
      retention-days: 10
